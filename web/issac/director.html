<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奶妹 · 以撒导播台</title><link rel="stylesheet" href="/director.css"></head>
<body><header><div><span class="eyebrow">奶妹的游戏直播间</span><h1>以撒的结合</h1></div><span id="sessionBadge" class="badge">正在连接</span></header>
<main><section class="monitor"><div class="section-top"><h2>人物与节目预览</h2><span>静音</span></div><div class="preview"><iframe id="preview" src="/issac/preview?renderer=preview" title="奶妹与节目静音预览" allow="autoplay"></iframe></div><p class="hint">游戏画面由直播姬直接捕获，叠加此节目页。这里用于查看人物、字幕和弹幕。</p><div class="row"><a href="/issac/preview?renderer=preview" target="_blank" rel="noopener">打开静音预览 ↗</a><button id="previewToggle" class="quiet">关闭预览</button></div></section>
<section class="controls"><div class="section-top"><h2>本地排练</h2><span id="rehearsalState">未开始</span></div><div class="row"><button data-action="rehearsal">准备人物播报</button><button data-action="pause" class="quiet">暂停游戏</button><button data-action="resume" class="quiet">继续自主游玩</button></div><p class="hint">请先在直播姬加入正式节目源。准备播报只开启本地排练；画面场景切换与游戏暂停分别操作。</p>
<label for="speech">让奶妹说一句</label><textarea id="speech" rows="3" maxlength="80" placeholder="输入本次想播报的话……"></textarea><button id="speak">播报这句话</button><p id="speechResult" aria-live="polite"></p>
<div class="divider"></div><h2>出镜形态</h2><div class="choices" id="modes"><button data-mode="M01">01 日光陪玩</button><button data-mode="M02">02 暖夜陪玩</button><button data-mode="M03">03 专注对局</button></div><p class="hint">说话和喝水结束后，才可切换形态。</p>
<div class="divider"></div><h2>节目画面</h2><div class="fields"><label>场景<select id="scene"><option value="play">游戏中</option><option value="interact">互动</option><option value="break">休息</option><option value="recover">恢复连接</option></select></label><label>弹幕位置<select id="side"><option value="right">右侧</option><option value="left">左侧</option></select></label><label>人物窗口<select id="avatar"><option value="circle">圆形</option><option value="landscape">横框</option></select></label><label>弹幕样式<select id="chat"><option value="feed">列表</option><option value="fly">飘屏</option><option value="off">隐藏</option></select></label></div>
<div class="volume"><label>人声音量<input id="speechVolume" type="range" min="0" max="1" step="0.05" value="1"></label><label>游戏音量<input id="gameVolume" type="range" min="0" max="1" step="0.05" value="1"></label></div><button id="mute" class="quiet">静音节目</button>
</section><section class="health"><div class="section-top"><h2>运行情况</h2><span id="lastUpdate">—</span></div><dl id="health"></dl><p id="notice" role="status" aria-live="polite">正在读取当前状态……</p><details><summary>游戏窗口与菜单</summary><p class="hint">仅操作本项目游戏窗口。使用已备份并授权的存档3；不会自动新建或覆盖存档。</p><div class="row"><button data-action="launch" class="quiet">打开并连接游戏</button><button data-action="observe" class="quiet">查看当前状态</button><button data-action="install" class="quiet">准备本局控制</button></div><div class="row menu"><button data-key="left">←</button><button data-key="up">↑</button><button data-key="down">↓</button><button data-key="right">→</button><button data-key="enter">确认</button><button data-key="escape">返回</button></div><pre id="gameDetail"></pre></details></section></main>
<footer>奶妹 · NCM01 · 本地运行 <span>节目画面沿用 MC 定稿版式</span></footer><script src="/director.js"></script></body></html>
