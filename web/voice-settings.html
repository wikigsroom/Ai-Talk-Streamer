<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>林知夏 · 当前直播音色</title>
<style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#162949;font:15px/1.7 "Microsoft YaHei UI","Segoe UI",sans-serif}main{max-width:920px;margin:44px auto;padding:0 24px}a{color:#526bd6}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:30px}h1{font-size:29px;margin:0}h2{font-size:19px;margin:0 0 6px}p{color:#68768d}.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}article{border:1px solid #dce4f0;background:#fcfdff;border-radius:12px;padding:25px}strong.code{font:600 24px "Segoe UI",sans-serif;color:#526bd6;display:block;margin-bottom:12px}article.backup strong.code{color:#9561b5}button{font:inherit;background:#162949;border:0;border-radius:7px;color:white;padding:9px 18px;cursor:pointer}button:disabled{opacity:.45;cursor:default}audio{width:100%;margin:15px 0}#state{padding:16px 20px;background:white;border:1px solid #dce4f0;border-radius:8px;margin:22px 0}#feedback{min-height:30px;color:#526bd6}.note{font-size:13px}button:focus-visible,a:focus-visible{outline:3px solid #879bea;outline-offset:3px}@media(max-width:620px){main{margin:24px auto;padding:0 17px}.cards{grid-template-columns:1fr}header{align-items:start}h1{font-size:24px}}</style></head>
<body><main><header><div><p>女A · 林知夏 / 日光宿舍</p><h1>当前直播音色</h1></div><a href="/">返回演播台 ↗</a></header><p>暂定使用 O07「夏栀」，F07 保留为备用。两套模型沿用同一份合成参考声线；下方试听来自选型样本。</p>
<div id="state" role="status">正在读取当前音色…</div><section class="cards">
<article><strong class="code">O07</strong><h2>OmniVoice · 夏栀</h2><p>默认声线 / 温柔清甜</p><audio controls preload="none" src="/voice-audio/female-a-o07/O07-audition.wav"></audio><button data-voice="O07">使用 O07 默认音色</button></article>
<article class="backup"><strong class="code">F07</strong><h2>F5-TTS v1 · 夏栀</h2><p>备用声线 / 同号参考克隆</p><audio controls preload="none" src="/voice-audio/female-a-o07/F07-audition.wav"></audio><button data-voice="F07">切换为 F07 备用音色</button></article>
</section><p id="feedback" role="status"></p><p class="note">切换在语音生成空闲时保存，对下一次生成生效。O07 生成失败时会尝试 F07，实际使用的编号会写入播报事件和日志；打断操作不会触发备用播报。两套都失败时会提示错误。</p><p class="note">本页切换保留当前人物、宿舍、动作和对话记忆。</p></main>
<script>
const state=document.querySelector('#state'),feedback=document.querySelector('#feedback'),buttons=[...document.querySelectorAll('[data-voice]')];
async function refresh(){try{const r=await fetch('/api/studio/status'),s=await r.json(),v=s.voice;if(!r.ok||!v)throw Error('语音服务尚未就绪');state.textContent='当前选择：'+v.voice_id+' / '+v.engine+' · '+(s.tts_ready?'可用':'准备中')+(v.degraded?' · 当前由备用保障':'');for(const b of buttons)b.disabled=!!v.busy||!v.workers?.[b.dataset.voice]?.ready;bLabel(v.voice_id)}catch(e){state.textContent=e.message}}
function bLabel(id){for(const b of buttons)b.textContent=b.dataset.voice===id?'当前已选择 '+id:(b.dataset.voice==='O07'?'使用 O07 默认音色':'切换为 F07 备用音色')}
for(const b of buttons)b.onclick=async()=>{feedback.textContent='正在切换…';try{const r=await fetch('/api/studio/voice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voice_id:b.dataset.voice})}),s=await r.json();if(!r.ok||s.error)throw Error(s.error||'切换失败');feedback.textContent='已保存 '+b.dataset.voice+'，下一次语音生成时生效。';await refresh()}catch(e){feedback.textContent=e.message}};
for(const a of document.querySelectorAll('audio'))a.onplay=()=>{for(const other of document.querySelectorAll('audio'))if(a!==other)other.pause()};
refresh();setInterval(refresh,4000);
</script></body></html>
