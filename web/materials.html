<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动作素材库 · 映现场</title><link rel="stylesheet" href="/studio.css"><style>
[hidden]{display:none!important}main{max-width:1120px}.library{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:36px;align-items:start}.portrait{position:sticky;top:24px}.portrait video{width:100%;aspect-ratio:9/16;display:block;background:#17273c;border-radius:12px}.portrait h2{font-size:18px;margin:16px 0 8px}.portrait p{color:#61718a;font-size:13px;line-height:1.8}.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.filter button,.clip{border:1px solid #d3ddeb;background:#fff;color:#273e5b;cursor:pointer;border-radius:7px;padding:11px 14px}.filter button.selected,.clip.selected{border-color:#3157db;background:#edf1ff;color:#2248c5}.clips{display:grid;grid-template-columns:1fr 1fr;gap:10px}.clip{text-align:left;min-height:78px}.clip{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:center}.clip img{width:48px;height:85px;object-fit:cover;border-radius:4px}.clip b{display:block;font-size:14px;line-height:1.5}.clip small{display:block;color:#75849a;margin-top:7px}.library-status{font-size:13px;color:#61718a;min-height:20px}.library-actions{display:flex;gap:10px;flex-wrap:wrap}.library-actions a{align-self:center;color:#3157db;font-size:13px}@media(max-width:740px){.library{grid-template-columns:1fr;gap:26px}.portrait{position:static;max-width:350px;margin:auto}.clips{gap:8px}.clip{padding:10px}.masthead{gap:12px}.masthead>a:last-child{font-size:13px}}
</style></head><body><header class="masthead"><a class="brand" href="/"><span class="brand-mark">映</span><span>映现场<small>MOTION LIBRARY</small></span></a><a href="/">返回竖屏演播台 →</a></header><main><div class="page-intro"><div><p class="eyebrow">动作素材库</p><h1>让每一次回应，都有些不同。</h1><p class="subtitle" id="libraryCount">正在读取已就绪的素材…</p></div></div><p class="library-status" id="productionNotice" hidden></p><div class="library"><section class="portrait"><video id="sample" controls loop playsinline preload="metadata" poster="/api/studio/poster"></video><h2 id="selectedTitle">选择一段动作</h2><p>这里可回看完整动作。需要带声音的实时说话画面，请回演播台输入文字。</p><div class="library-actions"><button class="button primary" id="applyBtn" disabled>在直播中播放一次</button><a href="/" >返回演播台播报 ↗</a><a href="/materials/download">下载完整素材包 ↓</a><a href="/poses">查看人物动作参考照 ↗</a><a href="/demo/vertical-demo.mp4">查看说话样片（录屏） ↗</a></div><p class="library-status" id="libraryFeedback" role="status"></p></section><section><div class="filter" id="filters"></div><div class="clips" id="clips"></div></section></div></main><script>
(()=>{let items=[],category='all',selected=null;const v=document.getElementById('sample'),clips=document.getElementById('clips'),feedback=document.getElementById('libraryFeedback');
 function pick(item,play=true){selected=item;v.poster=item.poster_url;v.src=item.url;v.load();if(play)v.play().catch(()=>{});document.getElementById('selectedTitle').textContent=item.title;document.getElementById('applyBtn').disabled=false;render();}
 function render(){clips.replaceChildren(...items.filter(i=>category==='all'||i.category===category).map(i=>{const b=document.createElement('button');b.className='clip'+(selected?.id===i.id?' selected':'');const title=document.createElement('b');title.textContent=i.title;const meta=document.createElement('small');meta.textContent=i.category_label+' · '+i.duration_seconds+' 秒';const thumbnail=document.createElement('img');thumbnail.src=i.poster_url;thumbnail.alt='';thumbnail.loading='lazy';const text=document.createElement('span');text.append(title,meta);b.append(thumbnail,text);b.onclick=()=>pick(i);return b;}));}
 fetch('/api/studio/materials').then(r=>r.json()).then(data=>{items=data.items;if(data.preparing){const notice=document.getElementById('productionNotice');notice.hidden=false;notice.textContent='素材制作中：已生成 '+data.generated+' 段，已复核上架 '+data.count+' 段，目标至少 '+data.target+' 段。可刷新查看新增素材；实时播报将在整批准备后恢复。';document.getElementById('applyBtn').hidden=true;document.querySelectorAll('.library-actions a').forEach(a=>a.hidden=!['/poses','/demo/vertical-demo.mp4'].includes(a.getAttribute('href')));const back=document.querySelector('.masthead>a:last-child');back.textContent='素材制作进行中';back.removeAttribute('href');}document.getElementById('libraryCount').textContent=data.count+' 段完整动作 · '+data.seconds+' 秒素材 · 9:16 竖屏';const categories=[['all','全部'],...new Map(items.map(i=>[i.category,i.category_label])).entries()];document.getElementById('filters').replaceChildren(...categories.map(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.className=id===category?'selected':'';b.onclick=()=>{category=id;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('selected',x===b));render();};return b;}));if(items.length)pick(items[0],false);else feedback.textContent='素材仍在准备中，复核后会出现在这里。';}).catch(()=>{feedback.textContent='素材库暂时无法读取。';});
 document.getElementById('applyBtn').onclick=async()=>{try{const r=await fetch('/api/studio/motion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:selected.id})});const x=await r.json();if(!r.ok)throw Error(x.error);feedback.textContent='已排队：'+selected.title+'，将在当前动作结束后播放。';}catch(e){feedback.textContent=e.message;}};
 addEventListener('pagehide',()=>{v.pause();v.removeAttribute('src');v.load();});
})();
</script></body></html>
