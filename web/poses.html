<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物动作参考照 · 映现场</title><link rel="stylesheet" href="/studio.css"><style>
main{max-width:1120px}.pose-layout{display:grid;grid-template-columns:minmax(250px,350px) minmax(0,1fr);gap:36px;align-items:start}.pose-preview{position:sticky;top:24px}.pose-preview>img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px;background:#e2e7ef}.pose-preview h2{font-size:18px;margin:16px 0 10px}.pose-preview p{font-size:13px;line-height:1.8;color:#61718a}.pose-preview a{font-size:13px;color:#3157db;display:inline-block;margin:5px 14px 0 0}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.filters button,.pose-card{border:1px solid #d3ddeb;background:white;border-radius:7px;color:#273e5b;cursor:pointer;padding:10px 13px}.filters button.selected,.pose-card.selected{border-color:#3157db;background:#edf1ff;color:#2248c5}.pose-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.pose-card{padding:7px;text-align:left;min-width:0}.pose-card img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:4px;display:block}.pose-card b{display:block;font-size:13px;margin:9px 3px 4px;line-height:1.5}.pose-card small{display:block;font-size:11px;margin:0 3px 5px;color:#75849a}@media(max-width:740px){.pose-layout{grid-template-columns:1fr;gap:26px}.pose-preview{position:static;max-width:350px;margin:auto}.pose-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.masthead{gap:12px}.masthead>a:last-child{font-size:13px}}
</style></head><body><header class="masthead"><a class="brand" href="/materials"><span class="brand-mark">映</span><span>映现场<small>POSE REFERENCES</small></span></a><a href="/materials">观看动作视频 →</a></header><main><div class="page-intro"><div><p class="eyebrow">人物动作参考照</p><h1>手势、神态，与自然的坐姿。</h1><p class="subtitle" id="poseCount">正在读取参考照…</p></div></div><div class="pose-layout"><section class="pose-preview"><img id="selectedPose" alt="选中的人物动作参考照"><h2 id="poseTitle">选择一张参考照</h2><p>同一人物、同一间日光宿舍。这里是静态动作参考；完整动作及实时播报请前往动作素材库和演播台。</p><a id="downloadOriginal" download>下载原尺寸 PNG ↓</a><a id="downloadPortrait" download>下载竖屏 PNG ↓</a></section><section><div class="filters" id="poseFilters"></div><div class="pose-grid" id="poseGrid"></div><p id="poseFeedback" role="status"></p></section></div></main><script>
(()=>{let items=[],category='all',selected=null;const grid=document.getElementById('poseGrid');
function pick(item){selected=item;document.getElementById('selectedPose').src=item.url;document.getElementById('selectedPose').alt=item.title;document.getElementById('poseTitle').textContent=item.title;document.getElementById('downloadOriginal').href=item.original_url;document.getElementById('downloadPortrait').href=item.url;render();}
function render(){grid.replaceChildren(...items.filter(i=>category==='all'||i.category===category).map(i=>{const b=document.createElement('button');b.className='pose-card'+(selected?.id===i.id?' selected':'');const img=document.createElement('img');img.src=i.url;img.loading='lazy';img.alt=i.title;const title=document.createElement('b');title.textContent=i.title;const info=document.createElement('small');info.textContent=i.category_label;b.append(img,title,info);b.onclick=()=>pick(i);return b;}));}
fetch('/api/studio/poses').then(r=>{if(!r.ok)throw Error();return r.json();}).then(data=>{items=data.items;document.getElementById('poseCount').textContent=data.count+' 张独立动作参考照 · 9:16 竖屏 · 原尺寸图可下载';const categories=[['all','全部'],...new Map(items.map(i=>[i.category,i.category_label])).entries()];document.getElementById('poseFilters').replaceChildren(...categories.map(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.className=id===category?'selected':'';b.onclick=()=>{category=id;document.querySelectorAll('#poseFilters button').forEach(x=>x.classList.toggle('selected',x===b));render();};return b;}));if(items.length)pick(items[0]);}).catch(()=>{document.getElementById('poseFeedback').textContent='参考照暂时无法读取，请稍后刷新。';});
})();
</script></body></html>
