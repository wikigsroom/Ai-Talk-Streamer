name: Repository verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source, documentation and reviewed asset verification
        run: python -X utf8 devtools/verify-repository.py
      - name: Native audio adapter test dependencies
        run: python -m pip install numpy pillow scipy soundfile requests aiohttp aiohttp-cors
      - name: Motion scheduling and speech adapter behavior
        run: python -m unittest discover -s tests -v
      - name: DSH and platform lifecycle, persistence and protocol tests
        run: node --test tests/dsh-*.test.mjs tests/platforms.test.mjs tests/platform-obs.test.mjs tests/platform-livehime.test.mjs tests/room-control.test.mjs
      - name: Native HTTP proxy and callback forwarding
        run: python -X utf8 tests/dsh_routes_probe.py
      - name: Native browser fixture dependencies
        run: npm ci --ignore-scripts
      - name: Chat collection and responsive platform page
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force outputs/ci | Out-Null
          node --test --test-reporter=tap tests/platform-browser.test.mjs tests/platform-ui.test.mjs tests/local-stream-browser.test.mjs tests/room-ui.test.mjs 2>&1 | Tee-Object -FilePath outputs/ci/browser-tests.txt
          $AvatarBrowserExit = $LASTEXITCODE
          '### Native browser checks' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```text' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content outputs/ci/browser-tests.txt | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($AvatarBrowserExit -ne 0) {
            $AvatarFailure = (Get-Content outputs/ci/browser-tests.txt -Tail 180) -join "`n"
            $AvatarFailure = $AvatarFailure.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Native browser failure::$AvatarFailure"
          }
          exit $AvatarBrowserExit
      - name: Retain browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-browser-diagnostics
          path: |
            outputs/ci/browser-tests.txt
            outputs/room-admin/ui/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem web,integration,devtools -Recurse -File -Include *.js,*.cjs | ForEach-Object {
            node --check $_.FullName
            if($LASTEXITCODE -ne 0){throw "JavaScript syntax failed: $($_.Name)"}
          }
      - name: PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem -File -Filter *.ps1 | ForEach-Object {
            $AvatarParseErrors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$null,[ref]$AvatarParseErrors)
            if($AvatarParseErrors.Count){throw "PowerShell syntax failed: $($_.Name)"}
          }
