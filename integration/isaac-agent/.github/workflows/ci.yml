name: Native Windows offline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements-native.lock.txt
      - name: Compile Python source
        run: python -m compileall -q src
      - name: Run offline Python and Lua regressions
        run: python -B -X utf8 -m unittest discover -s tests -q
      - name: Test DSH decision binding without host or network
        run: node --test tests/test_dsh_binding.mjs
