<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>数字人直播画面</title>
<style>html,body{margin:0;width:100%;height:100%;background:#101217;overflow:hidden}video{width:100%;height:100%;object-fit:contain}#notice{position:absolute;inset:0;display:grid;place-items:center;color:#ddd;font:24px sans-serif}#notice[hidden]{display:none}</style>
<video id="video" autoplay playsinline></video><div id="notice">正在连接本地数字人…</div><script src="/browser-id.js?v=1"></script><script src="/dsh-playback.js?v=3"></script><script src="/local-stream.js?v=dsh2-1"></script>
<script>
let current,stopped=false,timer,authorityTimer,authorityBusy=false;const video=document.querySelector('video'),notice=document.querySelector('#notice'),context=new AudioContext();
async function authority(){
 if(authorityBusy||!current?.dsh)return;authorityBusy=true;
 try{
  const r=await fetch('/api/dsh/status'),s=await r.json();if(!s.broadcast||s.broadcast.state==='DRAINING')return;
  let replace=false;
  if(new URLSearchParams(location.search).get('output')==='platform'){
   const p=await fetch('/api/dsh/platforms/output/player',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({consumer_id:current.dsh.consumerId,frames:video.getVideoPlaybackQuality?.().totalVideoFrames||0,audio_state:context.state})});
   if(p.ok)replace=!!(await p.json()).claim;
  }
  if(!replace&&s.health.authority_ready)return;
  await current.dsh.claim(s.broadcast.broadcast_id,replace);
 }catch{}finally{authorityBusy=false;}
}
async function connect(){
 if(stopped)return;if(current)current.close();
 try{
  await context.resume();
  current=new LocalAvatarStream(context,()=>{if(!stopped){notice.hidden=false;notice.textContent='连接已断开，正在重连…';clearTimeout(timer);timer=setTimeout(connect,5000)}});window.avatarTransport=current;
  video.srcObject=await current.connect();current.attachVideo(video);await video.play();notice.hidden=true;window.avatarSession='studio';void authority();
 }catch(error){current?.close();notice.hidden=false;notice.textContent='本地服务尚未就绪，正在重连…';clearTimeout(timer);if(!stopped)timer=setTimeout(connect,5000)}
}
authorityTimer=setInterval(authority,1500);addEventListener('beforeunload',()=>{stopped=true;clearTimeout(timer);clearInterval(authorityTimer);current?.close();context.close()});connect();
</script></html>
