<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>数字人直播画面</title>
<link rel="stylesheet" href="/room-overlay.css?v=room-1"><style>html,body{margin:0;width:100%;height:100%;background:#101217;overflow:hidden}#avatarVisual{position:absolute;inset:0}video,canvas{width:100%;height:100%;object-fit:contain}video[hidden]{display:none}#notice{position:absolute;inset:0;display:grid;place-items:center;color:#ddd;font:24px sans-serif;z-index:10;background:#101217aa}#notice[hidden]{display:none}</style>
<div id="avatarVisual"><video id="video" autoplay playsinline></video><div class="room-shade"></div></div><div id="roomOverlay"></div><div id="notice">正在连接本地数字人…</div><script src="/room-client.js?v=room-1"></script><script src="/room-audio.js?v=room-3080-2"></script><script src="/room-overlay.js?v=room-1"></script><script src="/browser-id.js?v=1"></script><script src="/dsh-playback.js?v=split-idle-4"></script><script src="/local-stream.js?v=room-1"></script>
<script>
let current,stopped=false,timer,authorityTimer,authorityBusy=false;const video=document.querySelector('video'),notice=document.querySelector('#notice'),context=new AudioContext();
const renderer=new URLSearchParams(location.search).get('renderer')||'obs';window.avatarAudioContext=context;if(['livehime','preview'].includes(renderer))document.title='女A · 林知夏 · 直播姬画面';if(renderer==='preview')video.muted=true;
const roomClient=window.roomClient=new RoomClient(),roomOverlay=new RoomOverlay(document.querySelector('#roomOverlay'),roomClient,{visual:document.querySelector('#avatarVisual')});roomClient.start();
async function authority(){
 if(authorityBusy||!current?.dsh)return;authorityBusy=true;
 try{
  let replace=false;
  if(new URLSearchParams(location.search).get('output')==='platform'){
   const p=await fetch('/api/dsh/platforms/output/player',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({consumer_id:current.dsh.consumerId,frames:current.directOutput?current.frames:video.getVideoPlaybackQuality?.().totalVideoFrames||0,width:current.directOutput?current.canvas.width:video.videoWidth,height:current.directOutput?current.canvas.height:video.videoHeight,audio_state:context.state,renderer,stream_metrics:current.metrics()})});
   if(p.ok){const output=await p.json();if(output.ignored)return;replace=!!output.claim;window.programConsumer=current.dsh.consumerId;}
   if(current.roomMixer)void roomClient.post('player',{consumer_id:current.dsh.consumerId,...current.roomMixer.metrics()}).catch(()=>{});
  }
  if(renderer==='preview')return;
  const r=await fetch('/api/dsh/status'),s=await r.json();if(!s.broadcast||s.broadcast.state==='DRAINING')return;
  if(!replace&&s.health.authority_ready)return;
  await current.dsh.claim(s.broadcast.broadcast_id,replace);
 }catch{}finally{authorityBusy=false;}
}
async function connect(){
 if(stopped)return;if(current){current.close();current.canvas.remove()}
 try{
  await context.resume();
  current=new LocalAvatarStream(context,event=>{if(!stopped){notice.hidden=false;notice.textContent='连接已断开，正在重连…';clearTimeout(timer);timer=setTimeout(()=>event?.code===4001?location.reload():connect(),5000)}},{directOutput:renderer==='livehime'});window.avatarTransport=current;
  if(current.directOutput){video.hidden=true;document.querySelector('#avatarVisual').prepend(current.canvas);await current.connect()}
  else{video.srcObject=await current.connect();current.attachVideo(video);await video.play()}
  notice.hidden=true;window.avatarSession='studio';void authority();
 }catch(error){current?.close();notice.hidden=false;notice.textContent='本地服务尚未就绪，正在重连…';clearTimeout(timer);if(!stopped)timer=setTimeout(connect,5000)}
}
authorityTimer=setInterval(authority,1500);addEventListener('beforeunload',()=>{stopped=true;clearTimeout(timer);clearInterval(authorityTimer);roomOverlay.close();roomClient.close();current?.close();context.close()});connect();
</script></html>
